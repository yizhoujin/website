<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday RSVP</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .event-details {
      font-size: 15px;
      color: #444;
      line-height: 1.8;
      margin: 6px 0 20px;
    }
    .event-details strong { color: #111; }
    .form-section {
      background: #fafafa;
      border: 1px solid #e6e6e6;
      border-radius: 6px;
      padding: 18px 20px;
      margin: 12px 0 18px;
    }
    .form-field {
      margin-bottom: 14px;
    }
    .form-field label {
      display: block;
      font-size: 13px;
      color: #666;
      margin-bottom: 4px;
    }
    .form-field input {
      width: 100%;
      padding: 9px 10px;
      font-size: 14px;
      font-family: inherit;
      border: 1px solid #d0d0d0;
      border-radius: 4px;
      background: #fff;
    }
    .form-field input:focus {
      outline: none;
      border-color: #1a0dab;
    }
    button.submit {
      margin-top: 4px;
      padding: 9px 18px;
      background: #1a0dab;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
    }
    button.submit:hover { background: #1505a0; }
    button.submit:disabled {
      background: #bbb;
      cursor: not-allowed;
    }
    .hint {
      font-size: 12.5px;
      color: #888;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="container">

    <header>
      <h1>Yizhou's Birthday Party! &#127881;</h1>
    </header>

    <hr>

    <p class="event-details">
      <strong>When:</strong> July 11, starts around 5:00 p.m.<br>
      <strong>Where:</strong> 21 Rose Park Drive<br>
      We're ordering food &mdash; bring your favorite drinks. Let me know if you can make it!
    </p>

    <div class="form-section">
      <form id="rsvp-form" onsubmit="return submitRsvp(event)">
        <div class="form-field">
          <label for="rsvp-name">Your name</label>
          <input type="text" id="rsvp-name" name="name" placeholder="First and last name" autocomplete="name" required>
        </div>
        <div class="form-field">
          <label for="rsvp-count">Number of people (including you)</label>
          <input type="number" id="rsvp-count" name="count" min="1" step="1" placeholder="1" required>
        </div>
        <div class="form-field">
          <label for="rsvp-phone">Phone number</label>
          <input type="tel" id="rsvp-phone" name="phone" placeholder="(555) 123-4567" autocomplete="tel" required>
        </div>
        <div class="form-field">
          <label for="rsvp-dietary">Dietary restrictions <span style="color:#999;">(optional)</span></label>
          <input type="text" id="rsvp-dietary" name="dietary" placeholder="e.g. vegetarian, nut allergy, none">
        </div>
        <button type="submit" class="submit">Send RSVP</button>
        <p class="hint">Hope to see you there!</p>
      </form>
    </div>

  </div>

  <script>
    // Apps Script Web App URL — RSVPs are appended as rows to the "RSVPs"
    // tab of the private "Birthday RSVPs" Google Sheet.
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwtipKbaPOdYB1wx4olcfUmCD8VeefIbKoGTcT7WqJHbe4QPWN51pTpWUFPGIU4cPzBMQ/exec";

    // Fallback recipient if the Sheet submission ever fails.
    const HOST_EMAIL = "ejoejin@gmail.com";

    async function postToSheet(payload) {
      // text/plain content-type avoids a CORS preflight on Apps Script.
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        redirect: "follow",
        body: JSON.stringify(payload),
        headers: { "Content-Type": "text/plain;charset=utf-8" }
      });
      const data = await res.json();
      if (data.status !== "ok") throw new Error(data.message || "Unknown error");
      return data;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    function mailtoFallback(subject, body) {
      window.location.href = "mailto:" + HOST_EMAIL +
        "?subject=" + encodeURIComponent(subject) +
        "&body=" + encodeURIComponent(body);
    }

    async function submitRsvp(e) {
      e.preventDefault();
      const f = e.target;
      const payload = {
        type: "rsvp",
        name: (f.name.value || "").trim(),
        count: (f.count.value || "").trim(),
        phone: (f.phone.value || "").trim(),
        dietary: (f.dietary.value || "").trim()
      };
      if (!payload.name || !payload.count || !payload.phone) {
        alert("Please fill in your name, number of people, and phone.");
        return false;
      }
      const btn = f.querySelector('button[type="submit"]');
      const orig = btn.textContent;
      btn.disabled = true;
      btn.textContent = "Sending...";
      try {
        if (!SCRIPT_URL) throw new Error("Submission endpoint not configured.");
        await postToSheet(payload);
        const section = f.closest(".form-section");
        section.innerHTML =
          '<p style="margin:0; color:#0a7d2c; font-weight:600;">Thanks, ' +
          escapeHtml(payload.name) + '! Your RSVP is in. See you there 🎉</p>';
      } catch (err) {
        btn.disabled = false;
        btn.textContent = orig;
        const proceed = confirm(
          "Could not save your RSVP automatically (" + err.message + ").\n\n" +
          "Click OK to send it by email instead, or Cancel to retry."
        );
        if (proceed) {
          const subject = "Birthday RSVP from " + (payload.name || "(no name)");
          const body =
            "Name: " + payload.name + "\n" +
            "Number of people: " + payload.count + "\n" +
            "Phone: " + payload.phone + "\n" +
            "Dietary restrictions: " + (payload.dietary || "(none)") + "\n";
          mailtoFallback(subject, body);
        }
      }
      return false;
    }
  </script>

</body>
</html>
